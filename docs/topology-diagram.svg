<svg viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="720" fill="#0f172a"/>
  <text x="600" y="42" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">FreshCart Container Topology</text>
  <text x="600" y="66" text-anchor="middle" fill="#94a3b8" font-size="14">docker-compose.yml — three containers, one bridge network, one named volume</text>

  <!-- network boundary -->
  <rect x="60" y="110" width="1080" height="430" rx="14" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="90" y="135" fill="#38bdf8" font-size="14" font-weight="700">network: freshcart-net (bridge)</text>
  <text x="90" y="153" fill="#64748b" font-size="12">containers reach each other by service name via Docker's embedded DNS — no hardcoded IPs</text>

  <!-- browser (external) -->
  <rect x="500" y="20" width="0" height="0"/>

  <!-- storefront container -->
  <rect x="110" y="185" width="290" height="160" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
  <text x="255" y="212" text-anchor="middle" fill="#f472b6" font-size="15" font-weight="700">storefront</text>
  <text x="255" y="230" text-anchor="middle" fill="#94a3b8" font-size="11">nginx:1.27-alpine · non-root</text>
  <text x="130" y="256" fill="#e2e8f0" font-size="12">• serves built static assets</text>
  <text x="130" y="276" fill="#e2e8f0" font-size="12">• reverse-proxies /api/* to</text>
  <text x="130" y="292" fill="#e2e8f0" font-size="12">  checkout-api:3000</text>
  <text x="130" y="318" fill="#fbbf24" font-size="12" font-weight="700">host 8080 → 8080</text>

  <!-- checkout-api container -->
  <rect x="450" y="185" width="290" height="160" rx="10" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="595" y="212" text-anchor="middle" fill="#4ade80" font-size="15" font-weight="700">checkout-api</text>
  <text x="595" y="230" text-anchor="middle" fill="#94a3b8" font-size="11">node:20-alpine · non-root</text>
  <text x="470" y="256" fill="#e2e8f0" font-size="12">• Express API, stateless</text>
  <text x="470" y="276" fill="#e2e8f0" font-size="12">• reads DATABASE_URL from env</text>
  <text x="470" y="296" fill="#e2e8f0" font-size="12">• waits on db healthcheck</text>
  <text x="470" y="318" fill="#fbbf24" font-size="12" font-weight="700">host 3000 → 3000 (debug only)</text>

  <!-- db container -->
  <rect x="790" y="185" width="290" height="160" rx="10" fill="#1e293b" stroke="#60a5fa" stroke-width="2"/>
  <text x="935" y="212" text-anchor="middle" fill="#60a5fa" font-size="15" font-weight="700">db</text>
  <text x="935" y="230" text-anchor="middle" fill="#94a3b8" font-size="11">postgres:16-alpine</text>
  <text x="810" y="256" fill="#e2e8f0" font-size="12">• seeded once from init.sql</text>
  <text x="810" y="276" fill="#e2e8f0" font-size="12">  (mounted read-only)</text>
  <text x="810" y="296" fill="#e2e8f0" font-size="12">• the only stateful container</text>
  <text x="810" y="318" fill="#fbbf24" font-size="12" font-weight="700">host 5432 → 5432 (debug only)</text>

  <!-- connections -->
  <path d="M 400 265 L 450 265" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="405" y="255" fill="#cbd5e1" font-size="11">HTTP /api</text>

  <path d="M 740 265 L 790 265" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="695" y="245" fill="#cbd5e1" font-size="11">postgres wire :5432</text>

  <!-- volume -->
  <ellipse cx="935" cy="435" rx="140" ry="42" fill="#1e293b" stroke="#facc15" stroke-width="2"/>
  <text x="935" y="428" text-anchor="middle" fill="#facc15" font-size="14" font-weight="700">volume: db-data</text>
  <text x="935" y="447" text-anchor="middle" fill="#cbd5e1" font-size="11">named, Docker-managed</text>

  <path d="M 935 345 L 935 393" stroke="#facc15" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="945" y="375" fill="#facc15" font-size="11">/var/lib/postgresql/data</text>

  <!-- user -->
  <circle cx="255" cy="580" r="26" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
  <text x="255" y="585" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="700">user</text>
  <text x="255" y="625" text-anchor="middle" fill="#cbd5e1" font-size="12">browser (host:8080)</text>
  <path d="M 255 555 L 255 350" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>

  <!-- legend / annotation box -->
  <rect x="60" y="580" width="1080" height="120" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="90" y="605" fill="#f8fafc" font-size="14" font-weight="700">Why each piece is here</text>
  <text x="90" y="628" fill="#cbd5e1" font-size="12">• Bridge network: containers need to find each other by name (db, checkout-api) without exposing internal ports publicly beyond what's mapped.</text>
  <text x="90" y="648" fill="#cbd5e1" font-size="12">• Named volume on db only: app and web containers are stateless and disposable — rebuilding them loses nothing. Postgres's data must outlive `down`/`up`.</text>
  <text x="90" y="668" fill="#cbd5e1" font-size="12">• Nginx proxies /api instead of the browser hitting checkout-api directly: keeps everything same-origin, avoids CORS, matches the local Vite dev-proxy behavior.</text>
  <text x="90" y="688" fill="#cbd5e1" font-size="12">• 5432/3000 published to host purely for local debugging (psql, curl) — the storefront never uses them; it talks over the internal network.</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#cbd5e1"/>
    </marker>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#facc15"/>
    </marker>
  </defs>
</svg>
