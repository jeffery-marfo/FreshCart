<svg viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="780" fill="#0f172a"/>
  <text x="600" y="42" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="700">Multi-Stage Build: What Crosses the Boundary</text>
  <text x="600" y="66" text-anchor="middle" fill="#94a3b8" font-size="14">checkout-api and storefront both follow the same shape — build stage full of tooling, final stage nearly empty</text>

  <!-- checkout-api column -->
  <text x="290" y="105" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">checkout-api</text>

  <!-- build stage box -->
  <rect x="70" y="125" width="440" height="230" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="90" y="152" fill="#38bdf8" font-size="15" font-weight="700">BUILD STAGE — node:20-alpine</text>
  <text x="90" y="178" fill="#e2e8f0" font-size="13">• node_modules (incl. devDependencies)</text>
  <text x="90" y="200" fill="#e2e8f0" font-size="13">• typescript compiler, tsx, @types/*</text>
  <text x="90" y="222" fill="#e2e8f0" font-size="13">• src/*.ts (source, uncompiled)</text>
  <text x="90" y="244" fill="#e2e8f0" font-size="13">• tsconfig.json</text>
  <text x="90" y="266" fill="#e2e8f0" font-size="13">• npm cache, package-lock.json</text>
  <text x="90" y="296" fill="#fbbf24" font-size="13" font-weight="700">runs: npm ci → npm run build (tsc)</text>
  <text x="90" y="320" fill="#fbbf24" font-size="13" font-weight="700">produces: /app/dist/*.js</text>
  <text x="90" y="344" fill="#64748b" font-size="12" font-style="italic">left behind entirely — this whole stage is discarded</text>

  <!-- arrow -->
  <path d="M 290 365 L 290 400" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="310" y="388" fill="#22c55e" font-size="12">COPY --from=build /app/dist</text>

  <!-- final stage box -->
  <rect x="70" y="405" width="440" height="180" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="90" y="432" fill="#22c55e" font-size="15" font-weight="700">FINAL STAGE — node:20-alpine</text>
  <text x="90" y="458" fill="#e2e8f0" font-size="13">• node_modules (prod deps only, --omit=dev)</text>
  <text x="90" y="480" fill="#e2e8f0" font-size="13">• dist/*.js  (compiled output ONLY)</text>
  <text x="90" y="502" fill="#e2e8f0" font-size="13">• package.json / package-lock.json</text>
  <text x="90" y="530" fill="#fbbf24" font-size="13" font-weight="700">runs as: USER node (uid 1000, non-root)</text>
  <text x="90" y="552" fill="#64748b" font-size="12" font-style="italic">no tsc, no src/, no devDeps, no npm cache</text>

  <!-- storefront column -->
  <text x="910" y="105" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="700">storefront</text>

  <rect x="690" y="125" width="440" height="230" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <text x="710" y="152" fill="#38bdf8" font-size="15" font-weight="700">BUILD STAGE — node:20-alpine</text>
  <text x="710" y="178" fill="#e2e8f0" font-size="13">• node_modules (vite, typescript)</text>
  <text x="710" y="200" fill="#e2e8f0" font-size="13">• src/*.ts, index.html, vite.config.ts</text>
  <text x="710" y="222" fill="#e2e8f0" font-size="13">• tsconfig.json</text>
  <text x="710" y="244" fill="#e2e8f0" font-size="13">• npm cache, package-lock.json</text>
  <text x="710" y="276" fill="#fbbf24" font-size="13" font-weight="700">runs: npm ci → tsc &amp;&amp; vite build</text>
  <text x="710" y="298" fill="#fbbf24" font-size="13" font-weight="700">produces: /app/dist/ (static html/css/js)</text>
  <text x="710" y="330" fill="#64748b" font-size="12" font-style="italic">left behind entirely — Node itself never ships</text>

  <path d="M 910 365 L 910 400" stroke="#22c55e" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="930" y="388" fill="#22c55e" font-size="12">COPY --from=build /app/dist</text>

  <rect x="690" y="405" width="440" height="180" rx="10" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
  <text x="710" y="432" fill="#22c55e" font-size="15" font-weight="700">FINAL STAGE — nginx:1.27-alpine</text>
  <text x="710" y="458" fill="#e2e8f0" font-size="13">• /usr/share/nginx/html/ (built static assets)</text>
  <text x="710" y="480" fill="#e2e8f0" font-size="13">• custom nginx.conf (unprivileged, port 8080)</text>
  <text x="710" y="502" fill="#e2e8f0" font-size="13">• nginx binary only</text>
  <text x="710" y="530" fill="#fbbf24" font-size="13" font-weight="700">runs as: USER nginx (non-root)</text>
  <text x="710" y="552" fill="#64748b" font-size="12" font-style="italic">no Node, no npm, no source, no build tools</text>

  <!-- bottom summary -->
  <rect x="70" y="615" width="1060" height="130" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="600" y="645" text-anchor="middle" fill="#f8fafc" font-size="15" font-weight="700">Why this matters</text>
  <text x="100" y="672" fill="#cbd5e1" font-size="13">Final images ship only compiled artifacts — no compilers, no dev dependencies, no source maps to a decompilable</text>
  <text x="100" y="692" fill="#cbd5e1" font-size="13">TypeScript source, no npm registry cache. Smaller image (faster pulls/deploys) and a smaller surface for a scanner</text>
  <text x="100" y="712" fill="#cbd5e1" font-size="13">to find CVEs in, since tools that never run in production (tsc, vite, the npm CLI itself) simply aren't present.</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#22c55e"/>
    </marker>
  </defs>
</svg>
