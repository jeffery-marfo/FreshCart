worker_processes auto;

# Non-root containers can't write to /var/run, and can't bind privileged
# paths owned by root — so pid and temp dirs move under /tmp, which we chown
# to the nginx user in the Dockerfile.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Temp paths nginx workers need write access to. Default locations live
    # under /var/lib/nginx, which root owns; redirect them under /tmp instead.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server {
        # Unprivileged (non-root) processes can't bind ports below 1024,
        # so this listens on 8080 instead of 80. Compose maps host 8080 -> 8080.
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Static assets built by Vite (JS/CSS/images with hashed filenames)
        # are safe to cache aggressively — a new build gets a new filename.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Same-origin reverse proxy to checkout-api, on the compose network.
        # Mirrors what Vite's dev server proxy does locally, so the storefront
        # code never needs to know it's a separate container, and the browser
        # never needs CORS headers to talk to the API.
        location /api/ {
            proxy_pass http://checkout-api:3000/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SPA-style fallback: any unmatched path serves index.html so
        # client-side routing (if added later) still works.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
